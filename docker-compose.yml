services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-arlocars}
      MYSQL_USER: ${MYSQL_USER:-arlocars}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-arlocars}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-arlocars}:${MYSQL_PASSWORD:-arlocars}@mysql:3306/${MYSQL_DATABASE:-arlocars}
      HOSTNAME: 0.0.0.0
      PORT: 3000
    volumes:
      - uploads_data:/app/public/uploads
    expose:
      - "3000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  nginx:
    build:
      context: ./docker/nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_HOST: app
      APP_PORT: 3000
      LETSENCRYPT_DOMAIN: ${LETSENCRYPT_DOMAIN:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      CERTBOT_STAGING: ${CERTBOT_STAGING:-0}
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    depends_on:
      app:
        condition: service_healthy

volumes:
  mysql_data:
  uploads_data:
  certbot_www:
  certbot_conf:
